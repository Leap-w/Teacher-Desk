<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 防白闪：应用挂载前按盘上偏好置 data-theme（与 useTheme/themeRepository 同一口径）
      ;(function () {
        try {
          var raw = localStorage.getItem('teacherdesk:theme')
          var pref = raw ? JSON.parse(raw) : 'system'
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式等读不到就交给 useTheme 兜底 */
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F8F83" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeacherDesk" />
    <meta name="description" content="TeacherDesk —— 面向高中班主任的综合工作台" />
    <title>TeacherDesk · 班主任工作台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
