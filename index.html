<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 防白闪：应用挂载前按盘上偏好置 data-theme（与 useTheme/themeRepository 同一口径）。
      // v3.1.0：只剩浅色 / 深色两档，「跟随系统」已撤下——盘上残留的旧值 'system'
      // 按本机当前系统的深浅折算一次（与 themeRepository.foldLegacySystem 同一规则），
      // 否则一位深色手机的教师打开应用会先闪一下白底。
      ;(function () {
        try {
          var raw = localStorage.getItem('teacherdesk:theme')
          var pref = raw ? JSON.parse(raw) : 'light'
          if (pref !== 'light' && pref !== 'dark') {
            pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = pref
        } catch (e) {
          /* 隐私模式等读不到就交给 useTheme 兜底 */
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A8C94" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeacherDesk" />
    <meta name="description" content="TeacherDesk —— 面向高中班主任的综合工作台" />
    <title>TeacherDesk · 班主任工作台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
