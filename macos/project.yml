# project.yml —— XcodeGen 的工程描述（**备用方案**）
#
# 平时用不到它：TeacherDesk.xcodeproj 已经手写好并提交了，直接双击打开即可。
# 这份文件是给「pbxproj 被改坏了 / 合并冲突解不干净 / 想从头重建工程」准备的退路：
#
#     brew install xcodegen
#     cd macos && xcodegen generate
#
# 它会用同一批源码和同一批设置重新生成一个 TeacherDesk.xcodeproj。
# 生成结果是等价的（target 名、bundle id、entitlements 都对得上），
# 只是文件顺序与 UUID 会变——所以**别在日常改动里顺手跑它**，
# 否则每次都会把 pbxproj 整个重写一遍，diff 没法看。
#
name: TeacherDesk
options:
  bundleIdPrefix: com.teacherdesk
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: '5.0' # Swift 5 语言模式：与手写的 pbxproj 保持一致
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  TeacherDesk:
    type: application
    platform: macOS
    sources:
      - path: TeacherDesk
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teacherdesk.mac
        INFOPLIST_FILE: TeacherDesk/Info.plist
        CODE_SIGN_ENTITLEMENTS: TeacherDesk/TeacherDesk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      # 宿主 App 要把 Widget 扩展嵌进自己的 .app 里，Widget 才会出现在小组件库里
      - target: TeacherDeskWidget
        embed: true
        codeSign: true

  TeacherDeskWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TeacherDeskWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teacherdesk.mac.widget
        INFOPLIST_FILE: TeacherDeskWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TeacherDeskWidget/TeacherDeskWidget.entitlements
        SKIP_INSTALL: YES
